name: janus-pilot

x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

x-core: &core
  JANUS_ENVIRONMENT: production
  JANUS_JWT_SECRET: ${JANUS_JWT_SECRET:?Generate deploy/.env first}
  JANUS_ENCRYPTION_KEY: ${JANUS_ENCRYPTION_KEY:?Generate deploy/.env first}
  JANUS_FRONTEND_URL: https://${APP_DOMAIN:?Set APP_DOMAIN}
  JANUS_PUBLIC_API_URL: https://${API_DOMAIN:?Set API_DOMAIN}
  JANUS_EMAIL_BACKEND: smtp
  JANUS_META_GRAPH_VERSION: ${JANUS_META_GRAPH_VERSION:?Set JANUS_META_GRAPH_VERSION}
  LITELLM_LOCAL_MODEL_COST_MAP: "True"

services:
  postgres:
    <<: *runtime
    image: postgres:16
    environment:
      POSTGRES_DB: janus
      POSTGRES_USER: janus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate deploy/.env first}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Generate deploy/.env first}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?Generate deploy/.env first}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../backend/docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U janus -d janus"]
      interval: 5s
      timeout: 3s
      retries: 30
  migrate:
    build: ../backend
    image: janus-pilot-api:local
    command: [/app/.venv/bin/alembic, upgrade, head]
    environment:
      JANUS_DATABASE_URL: postgresql+asyncpg://janus_app:${APP_DB_PASSWORD}@postgres:5432/janus
      JANUS_MIGRATION_DATABASE_URL: postgresql+asyncpg://janus:${POSTGRES_PASSWORD}@postgres:5432/janus
      JANUS_JWT_SECRET: ${JANUS_JWT_SECRET}
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *runtime
    build: ../backend
    image: janus-pilot-api:local
    environment:
      <<: *core
      JANUS_DATABASE_URL: postgresql+asyncpg://janus_app:${APP_DB_PASSWORD}@postgres:5432/janus
      JANUS_EMAIL_FROM: ${JANUS_EMAIL_FROM:?Set JANUS_EMAIL_FROM}
      JANUS_SMTP_HOST: ${JANUS_SMTP_HOST:?Set JANUS_SMTP_HOST}
      JANUS_SMTP_PORT: ${JANUS_SMTP_PORT:-587}
      JANUS_SMTP_USERNAME: ${JANUS_SMTP_USERNAME:-}
      JANUS_SMTP_PASSWORD: ${JANUS_SMTP_PASSWORD:-}
      JANUS_SMTP_STARTTLS: ${JANUS_SMTP_STARTTLS:-true}
      JANUS_S3_ENDPOINT_URL: ${JANUS_S3_ENDPOINT_URL:-https://s3.ap-south-1.amazonaws.com}
      JANUS_S3_REGION: ${JANUS_S3_REGION:-ap-south-1}
      JANUS_S3_BUCKET: ${JANUS_S3_BUCKET:-}
      JANUS_S3_ACCESS_KEY_ID: ${JANUS_S3_ACCESS_KEY_ID:-}
      JANUS_S3_SECRET_ACCESS_KEY: ${JANUS_S3_SECRET_ACCESS_KEY:-}
      JANUS_S3_PUBLIC_BASE_URL: ${JANUS_S3_PUBLIC_BASE_URL:-}
      # Voice calls relay through the turn service; credentials are minted per person.
      JANUS_STUN_URLS: stun:${TURN_DOMAIN:?Set TURN_DOMAIN}:3478
      JANUS_TURN_URLS: turn:${TURN_DOMAIN}:3478?transport=udp,turn:${TURN_DOMAIN}:3478?transport=tcp
      JANUS_TURN_SECRET: ${JANUS_TURN_SECRET:?Generate deploy/.env first}
      # Push notifications; left empty, announcements still go by email and in-app alerts.
      JANUS_VAPID_PRIVATE_KEY: ${JANUS_VAPID_PRIVATE_KEY:-}
      JANUS_VAPID_SUBJECT: ${JANUS_VAPID_SUBJECT:-mailto:support@example.com}
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      migrate: {condition: service_completed_successfully}
  worker:
    <<: *runtime
    build: ../backend
    image: janus-pilot-api:local
    command: [/app/.venv/bin/python, -m, janus_api.worker.main]
    stop_grace_period: 45s
    environment:
      <<: *core
      JANUS_DATABASE_URL: postgresql+asyncpg://janus_worker:${WORKER_DB_PASSWORD}@postgres:5432/janus
    depends_on:
      migrate: {condition: service_completed_successfully}
  web:
    <<: *runtime
    build: ..
    image: janus-pilot-web:local
    environment:
      JANUS_API_URL: http://api:8000
      JANUS_PUBLIC_API_URL: https://${API_DOMAIN}
      JANUS_APP_ORIGIN: https://${APP_DOMAIN}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      api: {condition: service_healthy}
  # TURN relay for voice calls between browsers that cannot reach each other directly. It needs its
  # own UDP ports, so it uses the host network instead of the proxy. It refuses to relay to private,
  # loopback and link-local addresses, so it cannot be used to reach this server's own network.
  turn:
    <<: *runtime
    image: coturn/coturn:4.6.3
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --realm=${TURN_DOMAIN}
      - --use-auth-secret
      - --static-auth-secret=${JANUS_TURN_SECRET}
      - --fingerprint
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      - --total-quota=100
      - --user-quota=12
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=::1
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
  proxy:
    <<: *runtime
    image: caddy:2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      TLS_EMAIL: ${TLS_EMAIL:?Set TLS_EMAIL}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: {condition: service_healthy}
      api: {condition: service_healthy}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
